<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div id="healthBar">
                <div id="healthFill"></div>
                <span id="healthText">100</span>
            </div>
            <div id="ammoCounter">
                <span id="ammoText">30 / 90</span>
            </div>
            <div id="crosshair"></div>
            <div id="doorHint" class="hidden">Druk op SPATIE om deur te openen</div>
        </div>
        <div id="menu">
            <h1>FUTURISTIC SHOOTER</h1>
            <button id="startButton">START GAME</button>
            <div id="controls">
                <p>WASD - Beweging</p>
                <p>Muisknop - Schieten</p>
                <p>SPATIE - Deur openen</p>
                <p>ESC - Menu</p>
            </div>
        </div>
    </div>
    <script type="module" src="src/game.js"></script>
</body>
</html>
